global
    maxconn 100

defaults
    log global
    mode tcp
    retries 2
    timeout client 30m
    timeout connect 4s
    timeout server 30m
    timeout check 5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen kingbase
    bind *:5000
    option httpchk
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server kingbase_127.0.0.1_54321 127.0.0.1:54321 maxconn 100 check port 8008
    server kingbase_127.0.0.1_54322 127.0.0.1:54322 maxconn 100 check port 8009

listen kingbase_replica
    bind *:5001
    option httpchk
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server kingbase_127.0.0.1_54321 127.0.0.1:54321 maxconn 100 check port 8008
    server kingbase_127.0.0.1_54322 127.0.0.1:54322 maxconn 100 check port 8009
