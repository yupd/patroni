scope: dsg_kb_cluster
#namespace: /service/
name: kingbase0

restapi:
  listen: 127.0.0.1:8008
  connect_address: 127.0.0.1:8008

etcd:
  # 注意：本段为 etcd v2 客户端（confd 依赖 v2 读取成员，不能换 etcd3）。
  # host 仅作单点 fallback；部署时必须通过环境变量 PATRONI_ETCD_HOSTS
  # 注入 hosts 列表（hosts 优先于 host），例如:
  #   -e PATRONI_ETCD_HOSTS=192.168.11.67:22379,192.168.11.68:22379,192.168.11.69:22379
  # 这样无论 etcd 监听 0.0.0.0 还是仅节点 IP 均可连接（无需写死 IP 在本文件）。
  host: 127.0.0.1:22379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true
      remove_data_directory_on_diverged_timelines: true  # Kingbase 无 sys_rewind，rewind 失败后自动删数据+重克隆
      pg_hba:
      - host replication replicator 127.0.0.1/32 md5
      - host replication replicator 0.0.0.0/0 md5
      - host all all 0.0.0.0/0 md5
      parameters:
        # Kingbase uses same parameter names as PostgreSQL
        # 注意：listen_addresses 不能写在这里（Patroni 禁止动态设置该参数，校验失败），
        # 由 Patroni 从 postgresql.listen 自动推断
        # DSG 自带 license 不支持 hot_standby，必须 off（流复制本身不依赖它）
        hot_standby: "off"
        # 慢 IO 环境下 basebackup 传输背压会触发默认 60s 的 wal_sender_timeout
        # 连接断开 → 无限重传循环。禁用超时避免
        wal_sender_timeout: 0
        max_connections: 1000  # Kingbase license 上限（>1000 会被钳制并打 WARNING）
        max_worker_processes: 8
        max_wal_senders: 10
        max_replication_slots: 10
        max_prepared_transactions: 0
        max_locks_per_transaction: 64
        wal_log_hints: "on"
        track_commit_timestamp: "off"
        archive_mode: "on"
        archive_timeout: 1800s
        archive_command: /bin/true

  initdb:
  - encoding: UTF8

postgresql:
  database_flavor: kingbase                   # <-- KEY: enables Kingbase naming conventions
  database: kingbase                           # Kingbase default DB (not 'postgres'/'dsg')
  listen: 0.0.0.0:5432                        # 与 PostgreSQL 默认端口一致
  connect_address: 127.0.0.1:5432
  data_dir: /home/kingbase/userdata/data
  bin_dir: /home/kingbase/install/kingbase/bin
  config_dir: /home/kingbase/userdata/data
  config_base_name: kingbase                  # generates kingbase.conf instead of postgresql.conf
  pgpass: /tmp/pgpass0
  authentication:
    replication:
      username: replicator
      password: rep-pass
    superuser:
      username: system                        # Kingbase default superuser
      password: login@135                     # Kingbase default password
    rewind:
      username: rewind_user
      password: rewind_password
  parameters:
    unix_socket_directories: '/tmp'
    shared_buffers: 128MB
    max_stack_depth: 5MB
    dynamic_shared_memory_type: posix
    password_encryption: scram-sha-256

tags:
    noloadbalance: false
    clonefrom: false
    nostream: false
